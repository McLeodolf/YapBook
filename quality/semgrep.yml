rules:
  - id: python-dynamic-execution
    languages: [python]
    severity: ERROR
    message: Avoid evaluating executable input; use a bounded data parser.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
  - id: python-shell-injection
    languages: [python]
    severity: ERROR
    message: Use argument arrays with shell=False and validated arguments.
    pattern-either:
      - pattern: subprocess.$METHOD(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Do not deserialize untrusted executable formats; use JSON or a safe loader.
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.load(..., Loader=yaml.Loader, ...)
  - id: python-query-interpolation
    languages: [python]
    severity: ERROR
    message: Use parameterized queries instead of interpolated SQL.
    pattern-either:
      - pattern: $CURSOR.execute(f"...", ...)
      - pattern: $CURSOR.execute($QUERY % $VALUE, ...)
      - pattern: $CURSOR.execute($QUERY + $VALUE, ...)
  - id: python-template-injection
    languages: [python]
    severity: ERROR
    message: Render a fixed template and pass user data as escaped variables.
    patterns:
      - pattern: render_template_string($TEMPLATE, ...)
      - pattern-not: render_template_string("...", ...)
  - id: python-disabled-tls
    languages: [python]
    severity: ERROR
    message: Preserve certificate verification for external requests.
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
  - id: python-unsafe-archive-extraction
    languages: [python]
    severity: ERROR
    message: Validate archive paths, sizes and resource budgets before extraction.
    pattern: $ARCHIVE.extractall(...)
  - id: python-dynamic-streamlit-html
    languages: [python]
    severity: ERROR
    message: Only static application markup may bypass Streamlit escaping.
    patterns:
      - pattern: st.markdown($HTML, ..., unsafe_allow_html=True, ...)
      - pattern-not: st.markdown("...", ..., unsafe_allow_html=True, ...)
  - id: javascript-dynamic-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not execute strings as JavaScript.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: document.write(...)
  - id: javascript-nosql-where
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not pass executable $where queries to a database.
    pattern: '$DB.$METHOD({..., $where: $EXPR, ...}, ...)'
  - id: javascript-dom-xss
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: Sanitize untrusted HTML with DOMPurify before a DOM sink.
    pattern-sources:
      - pattern: location.hash
      - pattern: location.search
      - pattern: window.location.hash
      - pattern: window.location.search
      - pattern: $EVENT.data
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
    pattern-sinks:
      - pattern: $NODE.innerHTML = $HTML
      - pattern: $NODE.outerHTML = $HTML
      - pattern: $NODE.insertAdjacentHTML($POSITION, $HTML)
  - id: javascript-unsafe-react-html
    languages: [javascript, typescript]
    severity: ERROR
    message: React HTML injection requires an explicitly reviewed sanitization boundary.
    pattern: <$TAG ... dangerouslySetInnerHTML={$VALUE} ... />
  - id: javascript-node-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: Avoid shell execution of interpolated input.
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
      - pattern: '$CHILD.spawn(..., {..., shell:true, ...})'
