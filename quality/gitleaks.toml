title = "YapBook secrets policy"

[extend]
useDefault = true

[[allowlists]]
description = "Installed third-party code, generated duplicate bundles, and ignored local reports; source tests remain scanned."
paths = ['''(^|[\\/])(\.git|\.venv|\.build-venv|node_modules|test-output|__pycache__)[\\/]''', '''web[\\/]frontend[\\/]dist[\\/]''', '''quality[\\/]bin[\\/]''']

[[rules]]
id = "yapbook-hardcoded-password"
description = "Hardcoded password or API credential requires review and removal/rotation."
regex = '''(?i)(?:password|passwd|api[_-]?key|access[_-]?token)\s*[=:]\s*["']([A-Za-z0-9+/=_!@#$%^&*.-]{12,})["']'''
secretGroup = 1
