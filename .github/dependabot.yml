version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      workflow-updates:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      frontend-updates:
        applies-to: version-updates
        patterns: ["*"]
# Security updates are separate; these groups only batch routine version updates.
# Python runtime and EXE build requirements are updated together.
