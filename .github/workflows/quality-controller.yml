name: YapBook quality controller

on:
  workflow_run:
    workflows: [YapBook quality evidence, YapBook review event]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

concurrency:
  group: quality-controller
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected controller only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Evaluate current revisions, reviews and exceptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m quality.controller
      - name: Publish consolidated evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-decisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-decisions.json
          if-no-files-found: error
          retention-days: 90
