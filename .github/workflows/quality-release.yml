name: YapBook reviewed EXE artifact
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open, independently approved PR with passing quality evidence
        required: true
        type: number
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test_sha: ${{ steps.gate.outputs.test_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_PR: ${{ inputs.pr_number }}
        run: python -m quality.release_guard --pr "$REVIEWED_PR"
  build:
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.test_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Build the tested revision
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python -m pip install --require-hashes --index-url https://pypi.org/simple -r quality/build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build_exe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testResult = Join-Path $PWD 'exe-self-test.txt'
          Start-Process -FilePath (Join-Path $PWD 'dist/YapBook.exe') -ArgumentList @('--self-test', $testResult) -WindowStyle Hidden -Wait
          if (-not (Test-Path -LiteralPath $testResult)) { throw 'EXE self-test did not complete' }
          if (-not (Get-Content -LiteralPath $testResult -Raw).StartsWith('OK:')) { throw 'EXE self-test failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: YapBook-reviewed-${{ needs.authorize.outputs.test_sha }}
          path: |
            dist/YapBook.exe
            exe-self-test.txt
          if-no-files-found: error
          retention-days: 30
