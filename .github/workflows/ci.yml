name: App tests

on:
  pull_request:
    branches: [main, feat/streamlit-reader]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Install Python dependencies
        run: python -m pip install --require-hashes --index-url https://pypi.org/simple -r requirements/requirements.txt -r web/requirements.txt
      - name: Desktop tests
        run: python -m unittest discover -s tests/desktop -t . -p "test_*.py" -v
      - name: Web backend tests
        working-directory: web
        run: python -m unittest discover -s tests -v
      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Frontend lint
        working-directory: web/frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: web/frontend
        run: npm test
      - name: Install browser
        working-directory: web/frontend
        run: npx --no-install playwright install chromium
      - name: Browser tests
        working-directory: web/frontend
        run: npm run test:browser
      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
