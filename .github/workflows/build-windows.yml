name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Build EXE
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build_exe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testResult = Join-Path $PWD 'exe-self-test.txt'
          Start-Process -FilePath (Join-Path $PWD 'dist/YapBook.exe') -ArgumentList @('--self-test', $testResult) -WindowStyle Hidden -Wait
          if (-not (Test-Path -LiteralPath $testResult)) { throw 'EXE self-test did not complete' }
          if (-not (Get-Content -LiteralPath $testResult -Raw).StartsWith('OK:')) { throw 'EXE self-test failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YapBook-Windows
          path: dist/YapBook.exe
          if-no-files-found: error
          retention-days: 30
