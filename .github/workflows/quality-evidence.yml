name: YapBook quality evidence

on:
  pull_request:
    branches: [main, feat/streamlit-reader]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout candidate merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controls
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install locked dependencies
        working-directory: candidate
        shell: pwsh
        run: |
          python -m pip install --require-hashes --index-url https://pypi.org/simple -r quality/ci.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location web/frontend
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Run quality checks
        working-directory: candidate
        shell: pwsh
        run: python -I ../controls/quality/ci_entry.py
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/test-output/quality-current/
          if-no-files-found: error
          retention-days: 30
